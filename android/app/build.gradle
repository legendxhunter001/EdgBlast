plugins {
    id 'com.android.application'
}

def hostName = (project.findProperty('appHost') ?: 'example.com').toString()
def vCode = Integer.parseInt((project.findProperty('appVersionCode') ?: '1').toString())
def ks = new Properties()
rootProject.file('keystore.properties').withInputStream { ks.load(it) }
def storePw = ks.getProperty('storePassword')
def keyAl = ks.getProperty('keyAlias')
def keyPw = ks.getProperty('keyPassword')

android {
    namespace 'app.edgeblast.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'app.edgeblast.twa'
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName '1.0'
        manifestPlaceholders = [hostName: hostName, defaultUrl: "https://${hostName}/"]
    }

    signingConfigs {
        release {
            storeFile rootProject.file('edgeblast.keystore')
            storePassword storePw
            keyAlias keyAl
            keyPassword keyPw
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
