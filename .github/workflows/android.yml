name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://xhdedxuuieavkaxhxyyl.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZGVkeHV1aWVhdmtheGh4eXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjQ3MzIsImV4cCI6MjEwMTY0MDczMn0.ITDE1b_PYOXEO4J-ESJWg8vVsu2PZ_JTlluM_14AAcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the web app that goes inside the Android app
        run: |
          npm ci
          npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          VERSION_CODE="${{ github.run_number }}" python3 scripts/android-setup.py
          npx cap sync android

      - name: Accept the Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the app
        run: |
          set +e
          export KS_FILE="$GITHUB_WORKSPACE/signing/edgeblast.keystore"
          export KS_PASS=$(grep '^storePassword=' signing/keystore.properties | cut -d= -f2)
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > ../build.log 2>&1
          CODE=$?
          cd ..
          if [ $CODE -ne 0 ]; then
            MSG=$(grep -v '^\s*$' build.log | grep -E "What went wrong|error:|Error|FAILED|Could not|not found|Execution failed|Caused by|Failed" -A2 | head -40 | sed 's/%/%25/g' | tr '\n' '~')
            echo "::error title=Gradle failed::${MSG}"
            TAIL=$(tail -25 build.log | sed 's/%/%25/g' | tr '\n' '~')
            echo "::error title=Gradle tail::${TAIL}"
            exit $CODE
          fi

      - name: Put the app on the site
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/edge-blast.apk
          git config user.name "edge-blast-build"
          git config user.email "build@users.noreply.github.com"
          git add public/downloads/edge-blast.apk
          git diff --cached --quiet || git commit -m "Android app build ${{ github.run_number }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
